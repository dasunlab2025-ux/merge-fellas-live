name: Merge Fellas YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install FFmpeg and gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install gdown

      - name: Download video from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=1tw8qKjW-ifhjkgY9bs0SLX7-Ua3pSmvm" -O video.mp4

      - name: Check video
        run: |
          ls -lh video.mp4
          ffprobe -v error -show_entries format=duration \
          -of default=noprint_wrappers=1 video.mp4

      - name: Start YouTube Live
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ffmpeg \
          -re \
          -stream_loop -1 \
          -i video.mp4 \
          -c:v libx264 \
          -preset veryfast \
          -b:v 4500k \
          -maxrate 4500k \
          -bufsize 9000k \
          -r 30 \
          -g 60 \
          -keyint_min 60 \
          -pix_fmt yuv420p \
          -c:a aac \
          -b:a 128k \
          -ar 44100 \
          -f flv \
          "rtmps://a.rtmps.youtube.com/live2/${STREAM_KEY}"
